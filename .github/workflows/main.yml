name: Build and Push to ACR

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      # 1. Checkout the source code from your repo
      - name: Checkout code
        uses: actions/checkout@v4
      
      # 2. Setup timestamp for versioning
      - name: Set timestamp
        run: echo "TS=$(date +'%Y%m%d-%H%M')" >> $GITHUB_ENV
      
      # 3. Set up Docker Buildx (required for advanced building/caching)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 4. Log into your Azure Container Registry
      - name: Login to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      # 5. Build the image using your Dockerfile and push it to ACR
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.ACR_LOGIN_SERVER }}/az-weather-api:${{ env.TS }}
